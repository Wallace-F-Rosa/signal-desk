services:
  signal-desk-messages:
    image: signal-desk/messages
    container_name: signal-desk-messages
    build: ./messages
    ports:
      - "8000:8000"
    volumes:
      - signal-desk-messages:/var/local/signal-desk/messages
    networks:
      - signal-desk-network
    environment:
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
  signal-desk-web:
    image: signal-desk/web
    container_name: signal-desk-web
    build: ./web
    ports:
      - "80:8080"
    volumes:
      - signal-desk-web:/var/local/signal-desk/web
    networks:
      - signal-desk-network
  postgres:
    image: postgres:16-alpine
    container_name: signal-desk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signal_desk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signal-desk-network

networks:
  signal-desk-network:
    driver: bridge

volumes:
  postgres_data:
  signal-desk-messages:
  signal-desk-web:
