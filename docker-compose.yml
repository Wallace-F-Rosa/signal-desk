services:
  postgres:
    image: postgres:16-alpine
    container_name: signal-desk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signal_desk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signal-desk-network

networks:
  signal-desk-network:
    driver: bridge

volumes:
  postgres_data:
